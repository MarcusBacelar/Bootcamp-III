name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  testes:
    name: Testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar suíte de testes
        run: pytest tests/test_harness.py -v

      - name: Verificar cobertura mínima de 90%
        run: pytest tests/test_harness.py --cov=src --cov-report=term-missing --cov-fail-under=90
